name: Build Shesh Prohor Godot 4 APK (v7 Full Bundled)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Godot Project ZIP & Copy Art
        run: |
          mkdir -p godot_project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Building from ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d godot_project
          mkdir -p godot_project/assets/art godot_project/assets/models godot_project/assets/fonts godot_project/build
          for f in menu_bg.jpg portrait_rakib.jpg portrait_tanvir.jpg portrait_arif.jpg; do
            if [ -f "$f" ]; then cp "$f" "godot_project/assets/art/$f"; fi
          done

      - name: Auto-Fetch Soldier.glb, Poly Haven HDRIs, PBR Textures & Bengali Font
        run: |
          python3 godot_project/tools/fetch_real_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d templates_tmp
          mv templates_tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import All 3D Models & Export Native Android APK
        run: |
          godot --headless --path godot_project --import || true
          godot --headless --path godot_project --export-debug "Android" build/SheshProhor3D_v7.apk

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Prohor-Godot4-v7-APK
          path: godot_project/build/SheshProhor3D_v7.apk
