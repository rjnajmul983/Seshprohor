name: Build Shesh Prohor 3D FPS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded ZIP
        run: |
          mkdir -p game_build
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game_build

      - name: Bundle Offline Three.js & GLTFLoader
        working-directory: ./game_build
        run: |
          mkdir -p app/src/main/assets/www/libs
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/www/libs/three.min.js
          curl -sL https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js -o app/src/main/assets/www/libs/GLTFLoader.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./game_build
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Prohor-3D-FPS-v2-APK
          path: game_build/app/build/outputs/apk/debug/app-debug.apk
